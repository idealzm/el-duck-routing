name: Build HAPP Routing Mod

on:
    workflow_dispatch:
        inputs:
            tag:
                description: 'Docker image tag (e.g. happ-routing-v1)'
                required: true
                default: 'happ-routing-latest'
    push:
        branches:
            - main
            - happ-routing

permissions:
    contents: read
    packages: write

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    build-dashboard:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Install dependencies
              working-directory: ./dashboard
              run: bun install --frozen-lockfile

            - name: Build dashboard
              run: ./build_dashboard.sh

            - name: Upload dashboard build
              uses: actions/upload-artifact@v4
              with:
                  name: dashboard-build
                  path: ./dashboard/build/
                  retention-days: 1

    build-and-push:
        needs: build-dashboard
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Download dashboard build
              uses: actions/download-artifact@v4
              with:
                  name: dashboard-build
                  path: ./dashboard/build/

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=raw,value=${{ inputs.tag || 'happ-routing-latest' }}
                      type=sha,prefix=happ-routing-

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max